name: Platform isolation tests
on:
  push:
    branches: [codex/platform-installation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-kernel:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install pywin32==311
      - run: python -B -m unittest discover -s tests/protector -p 'test_*.py' -v
      - shell: pwsh
        run: ./tests/protector/run_windows_probe.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-kernel-results
          path: |
            ${{ runner.temp }}/windows-native.json
            ${{ runner.temp }}/windows-probe.log
          retention-days: 7
  mac-service:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -B -m unittest discover -s tests/protector -p 'test_*.py' -v
      - run: python -B tools/prepare_runtime.py
      - run: python -B tools/bundle_protected_runtime.py
      - run: python -B tools/build_release.py
      - name: Protected service and synthetic materials
        run: |
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted "$(command -v python)" -I -B tests/protector/macos_service_probe.py --source "$PWD/privacy-assistant" --uid "$(id -u)" --gid "$(id -g)" --report "$RUNNER_TEMP/macos-service.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-service-results
          path: ${{ runner.temp }}/macos-service.json
          retention-days: 7
